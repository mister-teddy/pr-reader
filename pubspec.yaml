name: pr_reader
description: "A fast, responsive reader for GitHub pull requests of any size."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.1

dependencies:
  app_links: ^7.2.2
  cupertino_icons: ^2.0.0
  flutter:
    sdk: flutter
  flutter_markdown_plus: ^1.0.12
  flutter_secure_storage: ^11.2.0
  http: ^1.6.0
  markdown: ^7.3.1
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  fonts:
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700

# App icons; sources in assets/icon (SVG, rendered to PNG). Regenerate with
# `dart run flutter_launcher_icons`.
flutter_launcher_icons:
  image_path: assets/icon/full.png
  android: true
  adaptive_icon_background: assets/icon/background.png
  adaptive_icon_foreground: assets/icon/foreground.png
  ios: true
  remove_alpha_ios: true
  macos:
    generate: true
    image_path: assets/icon/macos.png
  web:
    generate: true
    background_color: "#4338CA"
    theme_color: "#4338CA"
